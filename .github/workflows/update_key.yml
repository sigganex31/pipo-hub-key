name: Gunluk Key Secici

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece yarısı 00:00'da çalışır
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-key:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari İndir
        uses: actions/checkout@v4

      - name: Rastgele Key Seç ve Güncelle
        run: |
          RANDOM_KEY="$(shuf -n 1 keys.txt)"
          echo "$RANDOM_KEY" > guncel_key.txt
          
          git config --global user.name "PipoBot"
          git config --global user.email "bot@pipo.com"
          git add guncel_key.txt
          git commit -m "Günlük key otomatik güncellendi" || exit 0
          git push

      - name: Discord'a Bildirim Gönder
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          CURRENT_KEY=$(cat guncel_key.txt)
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"⚡ **Pipo Hub Günlük Key'i Yenilendi!** ⚡\n🔑 **Bugünün Key'i:** \`$CURRENT_KEY\`\nBu key 24 saat boyunca geçerlidir!@everyone\"}" \
               $DISCORD_WEBHOOK
